name: e2e Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'NHASoftware/**'
      - 'NHA.Api.Tests/**'
      - '.github/workflows/e2e_tests.yml'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5258
      DisableHttpsRedirection: true
      ConnectionStrings__DefaultConnection: Server=127.0.0.1,1433;Database=NHAIntegrationTests;User Id=sa;Password=${{ secrets.SQL_SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False;
      NHA_API_BASE_URL: http://127.0.0.1:5258
      SQL_SA_PASSWORD: ${{ secrets.SQL_SA_PASSWORD }}
      FeatureManagement__Beta: "true"
      FeatureManagement__AnimeEnabled: "true"
      FeatureManagement__CustomizedPostsEnabled: "true"
      FeatureManagement__ForumsEnabled: "true"
      FeatureManagement__CryptoEnabled: "true"
      FeatureManagement__SponsorAdsEnabled: "true"
      FeatureManagement__GameWikiEnabled: "true"

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
          include-prerelease: true

      - name: Restore
        run: dotnet restore NHA.Software.sln

      - name: Build Project
        run: dotnet build NHA.Software.sln --configuration Release --no-restore

      - name: Wait for SQL Server
        shell: bash
        run: |
          sql_container_id=$(docker ps --filter "publish=1433" --format "{{.ID}}" | head -n 1)

          if [ -z "$sql_container_id" ]; then
            echo "SQL Server container was not found."
            docker ps -a
            exit 1
          fi

          for i in {1..60}; do
            if docker logs "$sql_container_id" 2>&1 | grep -q "SQL Server is now ready for client connections"; then
              echo "SQL Server is ready."
              exit 0
            fi
            echo "Waiting for SQL Server..."
            sleep 2
          done
          echo "SQL Server did not start in time."
          docker logs "$sql_container_id"
          exit 1

      - name: Build Project
        run: dotnet build NHA.Software.sln --configuration Release --no-restore

      - name: Start app
        shell: bash
        run: |
          ASPNETCORE_URLS=http://127.0.0.1:5258 \
          dotnet ./NHASoftware/bin/Release/net9.0/NHA.Website.Software.dll \
            > app.log 2>&1 &

          APP_PID=$!
          echo "$APP_PID" > app.pid
          echo "Started app process: $APP_PID"

          sleep 5

          echo "===== APP LOG ====="
          cat app.log || true

          echo "===== PROCESS ====="
          ps -fp "$APP_PID" || true

          echo "===== PORT 5258 ====="
          ss -ltnp | grep 5258 || true

      - name: Wait for app
        shell: bash
        run: |
          for i in {1..60}; do
            if ss -ltn | grep -q ':5258'; then
              echo "Port 5258 is listening."

              status=$(curl -s -o /tmp/response.html \
                -w "%{http_code}" \
                http://127.0.0.1:5258/ || true)

              echo "HTTP status: $status"
              echo "Response size:"
              wc -c /tmp/response.html

              if [ "$status" = "200" ]; then
                echo "Application is ready."
                exit 0
              fi
            fi

            echo "Waiting for application..."
            sleep 2
          done

          echo "Application failed to start."

          echo "===== APP LOG ====="
          cat app.log || true

          echo "===== PORTS ====="
          ss -ltnp || true

          exit 1

      - name: Test application response
        run: |
          curl -v http://127.0.0.1:5258/

      - name: Clone Test Repository
        run: git clone https://github.com/jlarnett/JavaTestFramework.git

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install Edge 152.0.4191.53 (pinned)
        run: |
          sudo apt-get update
          wget -q https://packages.microsoft.com/repos/edge/pool/main/m/microsoft-edge-stable/microsoft-edge-stable_152.0.4191.53-1_amd64.deb
          sudo apt-get install -y ./microsoft-edge-stable_152.0.4191.53-1_amd64.deb
          microsoft-edge --version

      - name: Setup Maven
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Create .env file
        run: |
          cd JavaTestFramework
          echo "APP_USERNAME=${{ secrets.APP_USERNAME }}" >> .env
          echo "APP_PASSWORD=${{ secrets.APP_PASSWORD }}" >> .env
          echo "BASE_URL=http://127.0.0.1:5258" >> .env
          echo "NHA_API_BASE_URL=http://127.0.0.1:5258" >> .env
          echo "WORKERS=${{ secrets.TEST_WORKERS }}" >> .env
          echo "HEADLESS=true" >> .env

      - name: Run Cucumber Selenium Tests
        timeout-minutes: 20
        run: |
          cd JavaTestFramework
          mvn clean test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: JavaTestFramework/target/cucumber-report.html

      - name: Stop app
        if: always()
        shell: bash
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi
